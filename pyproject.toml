[project]
name = "cc-relay"
version = "0.3.3"
description = "Intelligent interrupt layer for Claude Code and Codex — learns when to ask, when to proceed"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.102.0",
    "mcp[cli]>=1.27.1",
    "plyer>=2.1.0",
]

[project.optional-dependencies]
macos = ["pyobjus>=1.2.4"]

[project.urls]
Homepage = "https://github.com/solost23/cc-relay"
Repository = "https://github.com/solost23/cc-relay"

[project.scripts]
cc-relay = "cc_relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "cc_relay/**",
    "tests/**",
    "README*.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    ".mcp.json",
    ".python-version",
]
exclude = [
    ".idea/**",
    "*.egg-info/**",
    "dist/**",
    "pypi_token",
    "AGENTS.md",
    "CLAUDE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["cc_relay"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
